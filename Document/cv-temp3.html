<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Resume</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 36px;
            color: rgb(45, 3, 255);
        }
        .header h2 {
            font-size: 18px;
            color: gray;
        }
        .section-title {
            color: rgb(25, 76, 35);
            font-size: 24px;
            margin-top: 20px;
            border-bottom: 2px solid rgb(25, 76, 35);
            padding-bottom: 5px;
        }
        .contact-info, .education, .experience, .events, .skills, .languages, .interests {
            margin-top: 20px;
        }
        .experience-item, .education-item, .skill-item, .language-item, .interest-item {
            margin-bottom: 15px;
        }
        .experience-item h3, .education-item h3 {
            font-size: 16px;
            color: #333;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        ul li {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }
        .two-column {
            display: flex;
            justify-content: space-between;
        }
        .left-column, .right-column {
            width: 48%;
        }
        .box {
            background-color: #f1f1f1;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container" id="resumeContainer"></div>

    <script>
        const resumeData = {
            name: "name",
            title: "role",
            contactInfo: {
                linkedin: "https://www.linkedin.com/in/abhinavspramod/",
                github: "https://github.com/abhinavpramod",
                phone: "+91 1234567890",
                email: "abhinavpramod86@gmail.com"
            },
            experience: [
                {
                    role: "role",
                    company: "company",
                    duration: "start - end",
                    tasks: ["responsibility 1.", "responsibility 2."]
                },
                {
                    role: "role",
                    company: "company",
                    duration: "start - end",
                    tasks: ["responsibility 1.", "responsibility 2."]
                }
            ],
            education: {
                qualification: "qualification",
                institution: "University",
                duration: "start - end"
            },
            skills: ["skill 1", "skill 2", "skill 3"],
            projects: [
                { name: "project title", details: "project details" },
                { name: "project 2 details", details: "project details." }
            ]
        };

        const container = document.getElementById("resumeContainer");

        container.innerHTML = `
            <div class="header">
                <h1>${resumeData.name}</h1>
                <h2>${resumeData.title}</h2>
            </div>
            <div class="two-column">
                <div class="left-column">
                    <div class="section-title">EXPERIENCE</div>
                    ${resumeData.experience.map(exp => `
                        <div class="experience-item">
                            <h3>${exp.role}, ${exp.company}</h3>
                            <p>${exp.duration}</p>
                            <ul>${exp.tasks.map(task => `<li>${task}</li>`).join('')}</ul>
                        </div>
                    `).join('')}
                </div>
                <div class="right-column">
                    <div class="box">
                        <div class="section-title">CONTACT INFO</div>
                        <p>LinkedIn: <a href="${resumeData.contactInfo.linkedin}">${resumeData.contactInfo.linkedin}</a></p>
                        <p>GitHub: <a href="${resumeData.contactInfo.github}">${resumeData.contactInfo.github}</a></p>
                        <p>Phone: ${resumeData.contactInfo.phone}</p>
                        <p>Email: <a href="mailto:${resumeData.contactInfo.email}">${resumeData.contactInfo.email}</a></p>
                    </div>
                    <div class="box">
                        <div class="section-title">EDUCATION</div>
                        <p><strong>${resumeData.education.qualification}</strong><br>${resumeData.education.institution}<br>${resumeData.education.duration}</p>
                    </div>
                    <div class="box">
                        <div class="section-title">SKILLS & TOOLS</div>
                        <ul>${resumeData.skills.map(skill => `<li>${skill}</li>`).join('')}</ul>
                    </div>
                    <div class="box">
                        <div class="section-title">PROJECTS</div>
                        <ul>${resumeData.projects.map(project => `
                            <li><b>${project.name}</b><p>${project.details}</p></li>
                        `).join('')}</ul>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
