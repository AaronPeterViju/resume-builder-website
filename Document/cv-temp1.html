<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional CV</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
            color: #222;
        }
        header p {
            margin: 5px 0;
            color: #555;
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .section div {
            margin-bottom: 10px;
        }
        .experience, .education {
            margin-left: 20px;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        ul li {
            padding: 5px 0;
        }
        .skills span {
            display: inline-block;
            background: #007bff;
            color: #fff;
            padding: 8px 15px;
            border-radius: 15px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header id="header"></header>
        <section class="about section" id="about"></section>
        <section class="experience section" id="experience"></section>
        <section class="education section" id="education"></section>
        <section class="skills section" id="skills"></section>
        <section class="projects section" id="projects"></section>
    </div>

    <script>
        const cvData = {
            name: "your name",
            email: "abhinavpramod86@gmail.com",
            phone: "+91 1234567890",
            linkedin: "linkedin.com/in/abhinavspramod",
            about: "I am a third-year B.Tech student passionate about solving real-life problems and learning new skills.",
            experiences: [
                {
                    title: "role",
                    company: "Company",
                    duration: "start-end",
                    details: ["point 1.", "point 2."]
                }
            ],
            education: [
                {
                    qualification: "qualification",
                    institution: "University",
                    duration: "start - end"
                }
            ],
            skills: ["skill 1", "skill 2", "skill 3"],
            projects: [
                {
                    title: "project 1",
                    details: "project description."
                }
            ]
        };

        document.getElementById("header").innerHTML = `
            <h1>${cvData.name}</h1>
            <p>Email: ${cvData.email} | Phone: ${cvData.phone}</p>
            <p>LinkedIn: ${cvData.linkedin}</p>
        `;

        document.getElementById("about").innerHTML = `
            <h2>About Me</h2>
            <p>${cvData.about}</p>
        `;

        document.getElementById("experience").innerHTML = `
            <h2>Experience</h2>
            ${cvData.experiences.map(exp => `
                <div>
                    <h3>${exp.title}</h3> - ${exp.company}
                    <p>${exp.duration}</p>
                    <ul>
                        ${exp.details.map(detail => `<li>${detail}</li>`).join('')}
                    </ul>
                </div>
            `).join('')}
        `;

        document.getElementById("education").innerHTML = `
            <h2>Education</h2>
            ${cvData.education.map(edu => `
                <div>
                    <h3>${edu.qualification}</h3>
                    <p>${edu.institution}, ${edu.duration}</p>
                </div>
            `).join('')}
        `;

        document.getElementById("skills").innerHTML = `
            <h2>Skills</h2>
            <div>
                ${cvData.skills.map(skill => `<span>${skill}</span>`).join('')}
            </div>
        `;

        document.getElementById("projects").innerHTML = `
            <h2>Projects</h2>
            ${cvData.projects.map(proj => `
                <div>
                    <h3>${proj.title}</h3>
                    <p>${proj.details}</p>
                </div>
            `).join('')}
        `;
    </script>
</body>
</html>
